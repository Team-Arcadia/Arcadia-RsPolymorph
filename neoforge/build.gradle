plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').getAbsolutePath(), '--existing',
                    file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Refined Storage 2 — provided at runtime by the user's modpack; compile against the tracked
    // NeoForge jar. No Polymorph dependency (standalone).
    implementation files('../libs/rs2.jar')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
