plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    // Compile the common module against vanilla Minecraft only (no specific loader), via NeoForm.
    neoFormVersion = "${minecraft_version}-20240808.144430"

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    // Refined Storage 2 + Polymorph — compile-only; the common.* class names are identical across
    // loaders so the mixins (remap=false) resolve byte-for-byte on both NeoForge and Fabric.
    // The local jars are the NeoForge builds; their com.refinedmods.refinedstorage.common.* and
    // com.illusivesoulworks.polymorph.* surfaces match the Fabric builds (shared common modules).
    compileOnly files('../libs/rs2.jar')
    compileOnly files('../libs/polymorph.jar')
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
