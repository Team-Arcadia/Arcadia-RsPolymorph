pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        // ModFusioner plugin (optional fused-jar step)
        maven { url = uri('https://maven.firstdarkdev.xyz/releases') }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                // Subgroups too — Loom pulls net.fabricmc.unpick:* which is a subgroup of net.fabricmc.
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// This should match the folder name of the project, or else IDEA may complain
// (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'arcadia-rspolymorph'
// MC 1.21.1 / Refined Storage 2.x line
include('common')
include('fabric')
include('neoforge')
// MC 26.1.2 / Refined Storage 3.x line (parallel target, shares sources with the 1.21.1 modules).
// Build the 26.1.2 modules with Gradle running on JDK 25:
//   ./gradlew :neoforge-261:build -Dorg.gradle.java.home=<path-to-jdk-25>
include('common-261')
include('neoforge-261')
// fabric-261 is implemented (sources + entrypoints + metadata) but NOT enabled in the default
// build: MC 26.1.x ships UN-OBFUSCATED (no Mojang ProGuard mappings), which only fabric-loom
// 1.17.0-alpha+ supports, and that alpha conflicts with the stable Loom 1.16.3 used by the
// 1.21.1 fabric module in this same build. Enable it on a dedicated branch that bumps
// fabric-loom to 1.17.0-alpha (or once a stable Loom with 26.x support is released):
//   include('fabric-261')
