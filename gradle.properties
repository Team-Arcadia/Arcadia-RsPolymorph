# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Environment / mappings
java_version=21
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1, 1.22)
# Parchment mappings — https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.21.1
parchment_version=2024.11.17

## Loader versions
# https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.1.219
neoforge_loader_version_range=[4,)
# https://fabricmc.net/develop/
fabric_version=0.115.0+1.21.1
fabric_loader_version=0.16.10

## Mod Properties
mod_id=rspolymorph
mod_name=RS Polymorph
mod_author=vyrriox
mod_version=1.2.0
mod_group_id=com.vyrriox.rspolymorph
license=LGPL-3.0-or-later
credits=Team Arcadia
description=RS Polymorph adds Polymorph compatibility for the Refined Storage 2 crafting and pattern grids.

## Dependency version ranges (Polymorph / Refined Storage 2 / Quartz Arsenal)
polymorph_version_range=[1.1.0,)
refinedstorage_version_range=[2.0.1,)
quartz_arsenal_version_range=[1.0.7,)

## Modrinth maven coordinates for the loader-specific dependency jars (Fabric build pulls these)
# Refined Storage 2.0.8 — project KDvYkUg3 ; Polymorph 1.1.0+1.21.1 — project tagwiZkJ
refinedstorage_fabric_dep=maven.modrinth:refined-storage:2.0.8
polymorph_fabric_dep=maven.modrinth:polymorph:1.1.0+1.21.1
