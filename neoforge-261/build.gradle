plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version_261}"
}

version = mod_version
group = mod_group_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version_261 as int)
}

repositories {
    mavenCentral()
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
}

neoForge {
    version = neoforge_version_261

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client { client() }
        server { server(); programArgument '--nogui' }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Pull in the shared, 26.x-adapted common sources + resources from common-261.
def common261Java = configurations.create('common261Java') { canBeResolved = true }
def common261Resources = configurations.create('common261Resources') { canBeResolved = true }

dependencies {
    add('common261Java', project(path: ':common-261', configuration: 'common261Java'))
    add('common261Resources', project(path: ':common-261', configuration: 'common261Resources'))

    // Refined Storage 3.2.0 (NeoForge) — pinned by Modrinth version-ID (loader-deterministic).
    implementation "maven.modrinth:refined-storage:${refinedstorage_261_neoforge}"
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(common261Java)
    source(common261Java)
}

processResources {
    dependsOn(common261Resources)
    from(common261Resources)
    var props = [
            version                      : mod_version,
            minecraft_version            : minecraft_version_261,
            minecraft_version_range      : minecraft_version_range_261,
            neoforge_version             : neoforge_version_261,
            neoforge_loader_version_range: neoforge_loader_version_range_261,
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_author                   : mod_author,
            license                      : license,
            credits                      : credits,
            description                  : description,
            refinedstorage_version_range : refinedstorage_version_range_261,
            quartz_arsenal_version_range : quartz_arsenal_version_range,
    ]
    inputs.properties(props)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta', '*.mixins.json']) { expand props }
}
