plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.16.3' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.140' apply false
    // Optional: merges the per-loader jars into a single distributable jar.
    // The primary distribution is the two separate per-loader jars; the fused jar is a convenience.
    id 'com.hypherionmc.modutils.modfusioner' version '1.0.+'
}

// Root project coordinates — needed so ModFusioner has a non-empty package group to relocate under.
group = mod_group_id
version = mod_version

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// ── Single fused jar (optional) ───────────────────────────────────────────────
// Run `./gradlew fusejars` to produce one jar that loads on both NeoForge and Fabric,
// written to artifacts/fused/. Each loader still publishes its own standalone jar
// independently of this step — the per-loader jars are the primary distribution.
fusioner {
    packageGroup = mod_group_id
    mergedJarName = "${mod_id}-${mod_version}"
    jarVersion = mod_version

    neoforge {
        projectName = 'neoforge'
        // moddev produces a plain 'jar' (no Loom remap step on NeoForge)
        inputTaskName = 'jar'
    }

    fabric {
        projectName = 'fabric'
        // Loom's remapped output
        inputTaskName = 'remapJar'
    }
}

// ModFusioner's fusejars task does not track artifacts/fused as an output, so it reports
// UP-TO-DATE even after the jar is removed. Force it to always run so the fused jar is
// regenerated reliably (e.g. in CI/release).
tasks.matching { it.name == 'fusejars' }.configureEach {
    outputs.upToDateWhen { false }
}
